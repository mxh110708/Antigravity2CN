name: Regression tests

on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check source and dictionaries
        run: npm run check
      - name: Check macOS shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/run_macos.sh
          for file in *.command; do bash -n "$file"; done
      - name: Run isolated regression tests
        run: npm test
